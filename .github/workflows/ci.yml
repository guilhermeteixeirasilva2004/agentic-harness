name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "arquivos fora do gofmt:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # T-01: os testes rodam com o detector de corrida e geram cobertura, para
      # que concorrência quebrada e quedas de cobertura apareçam no CI.
      - name: go test (race + cobertura)
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out

      - name: piso de cobertura
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "cobertura total: ${total}%"
          # Piso conservador: sobe junto com a refatoração (meta: 80% no código novo).
          awk -v t="$total" 'BEGIN { if (t + 0 < 65) { print "cobertura abaixo do piso de 65%" > "/dev/stderr"; exit 1 } }'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0

      # O toolchain do projeto continua pinado em Go 1.22 (go.mod), cuja stdlib
      # acumula CVEs já corrigidos em versões novas do Go. Como o conserto é
      # trocar o toolchain (decisão à parte), esses achados entram como aviso;
      # vulnerabilidades em dependências de terceiros continuam bloqueando.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          "$(go env GOPATH)/bin/govulncheck" -json ./... > vuln.json || true
          findings=$(jq -s '[.[] | select(.finding != null)]' vuln.json)
          stdlib=$(jq 'map(select(.finding.trace[0].module == "stdlib") | .finding.osv) | unique | length' <<< "$findings")
          terceiros=$(jq 'map(select(.finding.trace[0].module != "stdlib") | .finding.osv) | unique | length' <<< "$findings")
          echo "vulnerabilidades na stdlib (toolchain pinado): $stdlib"
          if [ "$stdlib" -gt 0 ]; then
            jq -r 'map(select(.finding.trace[0].module == "stdlib") | .finding.osv) | unique[]' <<< "$findings" | sed 's/^/  aviso (stdlib): /'
          fi
          if [ "$terceiros" -gt 0 ]; then
            jq -r 'map(select(.finding.trace[0].module != "stdlib") | .finding.osv) | unique[]' <<< "$findings" | sed 's/^/  vulnerável: /'
            echo "::error::govulncheck encontrou vulnerabilidades fora da stdlib"
            exit 1
          fi
